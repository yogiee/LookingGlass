[model]
# Chat default. 2026-06-19: gemma4:12b → gemma4:26b (GGUF). Measured on M1 Max 32GB:
# 48.5 tok/s (faster than 12b@23.7 AND 26b-mlx@43.3), 17GB 100% GPU, honest + full Alice
# voice. CRUCIALLY GGUF honors num_ctx → KV is leashed (CONTEXT 16384, bounded regardless
# of chat length); the MLX path IGNORES num_ctx (unbounded KV → OOM risk on marathon chats)
# so 26b-mlx was rejected as default despite similar speed. Same gemma4 family = same voice.
# Cost: 17GB resident during active use (unloads after keep_alive idle). 12b stays the lean
# fallback; gemma4:latest is a per-chat pick via Settings → Model. (qwen3.5:4b-mlx dropped
# 2026-06-22 per the manifest keep_policy — fast but confabulates world-knowledge.)
# See gotcha_small_model_confabulation + reference_ollama_cloud_models (MLX num_ctx gotcha).
#
# 2026-06-29 UPDATE: the overnight bench (benchllama@06-29) REVERSED 26b-mlx's standing as a
# *build*: MLX now wins prefill (726 vs 382), wall (7.6 vs 8.6s), footprint (16.4 vs 17.4GB)
# AND holds prefill at depth (Battery-G collapse 0.948 vs 0.442 @32k). Quality is a tie
# (coding 1.000 vs 0.983; Alice-voice smoke-test ✓ on the 4 standard Qs). So the STABLE-LOCK
# revert default below now points at gemma4:26b-mlx. The ONE un-retired caveat keeps THIS live
# base on GGUF: MLX still ignores num_ctx, so the 16384 KV leash is a no-op (bench validated
# only to 32k filled, not marathon chats) — GGUF here = bounded KV. See project_consumer_manifest.
# 2026-07-02 (first CLEAN re-run, no clobber): swap CONFIRMED — prefill 730 vs 473, G-collapse
# 0.972 vs 0.44 hold; quality a wash. The two 06-29 caveats were single-run noise: the "MLX fails
# D6 parallel" did NOT reproduce, and consistency FLIPPED to GGUF (F 0.916 vs 0.869) — each build
# won one run, so call F a wash and keep MLX on speed/size/long-ctx. Rationale unchanged.
# 2026-07-02 OUR-OWN A/B (gotcha_mlx_gguf_numctx_truncation): per-token prefill is EQUAL between the
# builds in real Ollama serving — MLX's long-context edge is FIDELITY (it processes the full context)
# not raw speed. THIS live base stays GGUF precisely because it leashes KV: bounded RAM, and it
# truncates long inputs (bounded-but-lossy) — the right behavior for an always-on chat default.
# 2026-07-06: base default aligned to the fleet default (voice+hands collapse). Was gemma4:26b (GGUF,
# num_ctx-leashed); now gemma4:12b-mlx — the tool-native fleet default. 26b GGUF de-pinned from LG's roster
# (OllamaMCP still owns it: its local_vision#fallback1 + chat fallback). Tradeoff: MLX ignores num_ctx
# (unbounded KV), but 12b is small so marathon-chat KV stays manageable. Offline deep-research tail stays
# gemma4:26b-mlx (see [models] comment + the LG consumer manifest). Roster review: gemma4_moe_speed_and_mlx_fit.
# 2026-07-08: base default aligned to the ornith voice+hands trial (was gemma4:12b-mlx); revert together with [models].default.
default = "gemma4:26b-mlx"
ollama_host = "http://localhost:11434"
think = false
# Context window sent to Ollama (in `options`). The models' OWN default is 262144
# (256K), whose KV cache dwarfs the weights — it bloats RAM for every model and makes
# the 27B models choke / time out on 32GB. 16K is ample for chat + research and keeps
# memory sane (it's what made the 27B usable at all). Raise per-need.
num_ctx = 16384
# How long Ollama keeps the model resident after our last request. Sent on every
# /api/chat call. Multi-process-safe: the timer is refreshed by ANY client's
# inference, so a model shared with another process (e.g. OllamaMCP) stays loaded
# as long as that process keeps using it. "5m" matches Ollama's own default —
# don't shorten aggressively or the model unloads during mid-chat pauses and the
# next message pays reload latency. Accepts a duration ("5m"), 0 (unload now), or
# -1 (never unload).
keep_alive = "5m"

# Mode-aware routing table (Step 5). Mirrors the [models] section in project.toml.
# Used for independent (non-project) chats; projects can override per-mode in their
# own project.toml.
#
# Rankings source: BenchLLAMA aptitude run 2026-06-10. Full table: WORKSPACE/model-rankings.md.
#
# default  — gemma4:26b (GGUF): honesty-first Alice. 48.5 tok/s, 17GB, num_ctx-leashed.
#            Beats 12b on speed + capability; same voice. 12b = lean fallback (7.6GB).
#            gemma4:latest is a per-chat option via Settings → Model.
# research — gpt-oss:120b-cloud: deep-research routes to a LARGE CLOUD model (2026-06-19).
#            Local 27b/31b-mlx were dropped (slow on 32GB: ~11-14 tok/s); depth lives in
#            cloud now (fast + 0 local RAM). Deep-research ALWAYS uses this, overriding the
#            picker (the research button = explicit consent to use cloud). gpt-oss:120b =
#            max free-tier reasoning depth; voice is mechanical but research output is a
#            report artifact + handoff, so depth wins. In-voice alternative: gemma4:31b-cloud
#            (shallower). See design_alice_hybrid_butler_specialists / reference_ollama_cloud_models.
# coding   — gemma4:12b: tool quality worker. 4/4 D7+D8, think_ok. Upgrade from gemma4:latest.
#            gemma4:latest remains the fallback if 12b is not installed.
#
# Router model (llama3.2:3b, 10/10 classify, 177 tok/s) — not yet wired into sidecar.
# Currently routing is keyword-based (router.py). Neural router is a future improvement.
# specialist — the per-turn "Consult the big model" escalation target (Phase 1a). Unlike
#            `deep_research` (depth-first artifact → gpt-oss), this is the IN-VOICE escalation:
#            gemma4:31b-cloud holds Alice's voice, so escalate-the-turn yields depth + voice
#            with no framing. Invoked only by an explicit user tap (consent). See
#            design_alice_hybrid_butler_specialists.
#
# ── SMALL-SPECIALIST FLEET prototype (2026-06-21) ────────────────────────────────────
# Trying the multi-small-model theory (strategy_small_specialist_mlx_fleet,
# design_consumer_scope_fit_testing). 3 voice/work lanes co-resident on 32GB (~16GB), no
# swap on the everyday loop; deep research = cloud. Lite-bench validated: ZINI voice 3/3,
# 12b-mlx confab 4/4. GOTCHA: ZINI is completion-only (no tools) → router.py now detects
# tool-need and routes those turns to 12b-mlx; turns that dodge the detector + need a tool
# can still fabricate on ZINI (the structural cost of a tool-less chat default — full fix
# = Option B silent-hands, deferred).
#   default       = ZINI                small chat (voice; no tools)
#   coding        = gemma4:12b-mlx      tools + code (confab-clean 4/4, has tools)
#   research      = gemma4:12b-mlx      medium research (keyword-auto)
#   deep_research = gpt-oss:120b-cloud  large deep research (research button; max depth)
#   specialist    = gemma4:31b-cloud    consult-the-big-model (in-voice escalation)
#   hands         = llama3.2:3b         SILENT-HANDS tool-caller for the tool-less voice
#                                       default. When `default` can't call tools (ZINI), a
#                                       small tool-capable model runs the agent loop and the
#                                       voice model plates the result (butler: plates, not
#                                       re-cooks). hands needs ONLY tool-calling competence,
#                                       not voice/depth — so it's small + fast. Choice is the
#                                       open BenchLLAMA question (candidate_zini_tool_caller_
#                                       companions): llama3.2:3b (router-proven, 177 t/s) vs
#                                       granite4.1:3b (agentic-tuned) vs gemma4:12b-mlx. Swap
#                                       here. Falls back to `coding` if unset.
#
# ── STABLE LOCK (restore these 4 lines + delete the fleet block to revert) ────────────
#   default    = "gemma4:26b-mlx"  # 06-29: MLX twin won the bench (faster/lighter/holds-prefill@depth; voice ✓). GGUF 26b stays on disk as the live base above + ollama-mcp vision fallback.
#   coding     = "gemma4:12b"
#   research   = "gpt-oss:120b-cloud"
#   specialist = "gemma4:31b-cloud"
[models]
# 2026-07-06 VOICE+HANDS COLLAPSE (trial). default flipped ZINI → gemma4:12b-mlx: it out-behaves ZINI on
# every lite.py axis (4/4, confab-clean, register TIGHT) AND is tool-native (2/2 grounding), so the
# silent-hands butler is now DORMANT for default turns (the voice model calls tools directly). Cost: chat
# decode 63→34 t/s (still ~5× reading speed) + warmth is the one unmeasured axis → this is a living-on-it
# trial. REVERT: set default back to "s80982708/ZINI-LOCAL:latest" (kept on disk). Refs:
# gemma4_moe_speed_and_mlx_fit / lite_bench_voice_eval_2026-07 / design_model_grading_table.
#
# 2026-07-08 ORNITH VOICE+HANDS TRIAL — default → ornith:9b (supersedes the 07-06 gemma trial above).
# Full eval passed (candidate_zini_tool_caller_companions 07-08a..f): confab N=5 0.89 (>ZINI 0.73), organic
# voice > deployed Alice, register TIGHT with the brevity clause, tool-native (self-serves → butler dormant),
# RAM co-resident with image-gen = 18.4GB, and the with-tools pressure re-test CLEARED (holds honestly when
# the search returns empty — no D4b fabrication). qwen3.5-arch → think=false (global) honored cleanly.
# NEEDS the 2 Alice-prompt clauses (LENGTH + tool-discipline) pasted into Settings → Personality.
# REVERT ladder (all on disk): ornith:9b → gemma4:12b-mlx (07-06 trial) → s80982708/ZINI-LOCAL:latest.
default       = "gemma4:26b-mlx"   # 07-09 "ONE BIG MODEL" (Yogi's Simple mode): gemma4:26b-mlx is voice+work. Tool-CAPABLE → calls tools DIRECTLY (no hands, no plating-fabrication), GROUNDS instead of inventing (unlike ZINI/ornith), great voice, environment-aware. Cost: 17.6GB RAM (image-gen co-load handled by unload-before-image, see agent.py) + rare persona-slip. Revert ladder: gemma4:26b-mlx → ZINI+gemma-hands → gemma4:12b-mlx.
coding        = "gemma4:26b-mlx"   # one-big-model: same capable model does code (was 12b-mlx)
research      = "gemma4:26b-mlx"   # one-big-model: same capable model does research (was 12b-mlx)
# deep_research availability/privacy fallback chain (runtime uses the primary; the local tail is a
# manual pick when cloud is unreachable): gpt-oss:120b-cloud -> gemma4:31b-cloud -> gemma4:26b-mlx.
# Why 26b-mlx for the local tail: our own A/B (07-02, gotcha_mlx_gguf_numctx_truncation) — MLX ignores
# num_ctx and processes the FULL retrieved context, where GGUF at num_ctx=16384 SILENTLY TRUNCATES a
# long input (~17.5k tok -> ~8k) → MLX is the faithful RAG/synthesis pick. Cost: ~2x prefill + unbounded
# KV. (Per-token prefill is EQUAL between builds; the bench "holds-prefill" framing was misleading — the
# real distinction is full-context fidelity, not speed.)
deep_research = "gpt-oss:120b-cloud"
specialist    = "gemma4:31b-cloud"
hands         = "gemma4:26b-mlx"   # DORMANT under the one-big-model config (voice is tool-capable → direct tools, no butler). Kept = voice so hands_ok is False. Only matters if reverting to a tool-less voice (ZINI) → then set a distinct executor.

[server]
port = 8765
host = "127.0.0.1"

[agent]
system_prompt_path = "prompts/alice.md"
max_turns = 20

# MCP servers — each entry is spawned at startup (stdio transport).
# Tools are auto-registered alongside builtins; Alice can call them directly.
# Remove or comment-out an entry to disable that server.
[[mcp.servers]]
name    = "memoryCentral"
command = "/opt/homebrew/bin/node"
args    = ["/Users/yogi/WORK/PersonalProjects/MemoryCentral/server/index.js"]
